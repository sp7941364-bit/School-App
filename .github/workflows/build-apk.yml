name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp -r index.html app.js api.js cloudSync.js manifest.json sw.js assets www/
          if [ -d "stitch_basava_shrees_school_portal" ]; then
            cp -r stitch_basava_shrees_school_portal www/
          fi
          echo "Web distribution folder prepared successfully."
          ls -la www/

      - name: Install Dependencies
        run: |
          npm install

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Basava_Shree_School_Portal.apk
          echo "APK built successfully:"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Basava_Shree_School_Portal_APK
          path: output/Basava_Shree_School_Portal.apk
          retention-days: 90

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.7
          name: "Basava Shree School Portal Android App v1.0.7 (Student JAGADISH 10th Std Enrollment)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Basava Shree School - Android App (APK v1.0.7)

            ### Direct Download:
            Click below to download the application directly to your Android phone or tablet:
            - **[Download Basava_Shree_School_Portal.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.7/Basava_Shree_School_Portal.apk)**

            ---
            ### 🎓 Student Profile & Exclusive Roster (v1.0.7):
            - **Enrolled Student**: **JAGADISH** (Class 10-A, 10th Std)
            - **Roll Number**: `BSS-10050`
            - **Parent / Guardian Phone**: `9591943600` (`+91 95919 43600`)
            - **Parent Authentication**: Direct phone number login with instant password hint and PIN badge.
            - **Streamlined Database**: Pure, dedicated 1-student roster in SQLite database and faculty console.

            ---
            ### 📅 Daily Attendance Update & Start Today Engine:
            - **Automatic Date Defaulting**: Defaults to active day on roll call startup.
            - **Start Today's Roll Call Hero Card**: Instant roll call marking, re-editing unlock, and real-time ERP sync.
            - **Interactive Monthly Attendance Calendar**: Verified log with Gandhi Jayanti holiday and full month switching.
          files: output/Basava_Shree_School_Portal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

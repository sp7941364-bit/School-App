name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp -r index.html app.js api.js cloudSync.js manifest.json sw.js assets www/
          if [ -d "stitch_basava_shrees_school_portal" ]; then
            cp -r stitch_basava_shrees_school_portal www/
          fi
          echo "Web distribution folder prepared successfully."
          ls -la www/

      - name: Install Dependencies
        run: |
          npm install

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Basava_Shree_School_Portal.apk
          echo "APK built successfully:"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Basava_Shree_School_Portal_APK
          path: output/Basava_Shree_School_Portal.apk
          retention-days: 90

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.5
          name: "Basava Shree School Portal Android App v1.0.5 (Live Camera Studio & Multi-Device Sync)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Basava Shree School - Android App (APK v1.0.5)

            ### Direct Download:
            Click below to download the application directly to your Android phone or tablet:
            - **[Download Basava_Shree_School_Portal.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.5/Basava_Shree_School_Portal.apk)**

            ---
            ### 📸 Live Camera & Official Student Photo Studio (v1.0.5):
            - **Live Viewfinder Camera Studio**: Instant webcam stream preview with alignment frame guidelines, shutter capture, and flash animation.
            - **Multi-Camera Hardware Switching**: Automatic camera detection with device dropdown selector and flip camera button (front/rear toggling).
            - **100% Reliable Native Device Camera App**: Direct native device camera shutter integration (`capture="user"`), 8 official portrait avatars, and image upload.
            - **Dedicated Father Information Fields**: Replaced legacy labels with official "Father Name" and "Father Number" across profile dossiers and enrollment forms.
            - **Universal UI & Database Sync**: Student photo updates immediately reflect across Dashboard, Timetable, Profile Dossier, Hall Ticket, Attendance Roster, Marks Entry, and SQLite (`school.db`).

            ---
            ### ⚡ Real-Time Cross-Device Live Sync & SQLite Persistence:
            - **Unified Rock-Solid Server**: Zero connection drops; Node.js serves static assets, SQLite REST API, and Real-Time Live Sync Bus simultaneously.
            - **Real-Time Cross-Device Sync**: Adding/removing students or submitting attendance instantly updates all connected phones and computers live (<50ms).
            - **Smart Host & LAN Auto-Discovery**: Automatic network IP resolution for instant phone & tablet access over school/home Wi-Fi.

            ---
            ### ✨ All Features:
            - **Principal Portal**: Executive attendance overview across all 12 classes (LKG through Class 10), Staff Attendance logs & moderation, and school-wide KPIs.
            - **Faculty Roster**: Multi-grade student roll call and mark-as-present/absent tracking.
            - **Student & Parent View**: Examination hub, live timetable, and fee clearance receipts.
            - **Offline-Ready & Fast**: Lightweight, responsive interface with instant biometric simulation & dark mode support.
          files: output/Basava_Shree_School_Portal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

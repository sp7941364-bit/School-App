name: Build Android APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp -r index.html app.js api.js cloudSync.js manifest.json sw.js assets www/
          if [ -d "stitch_basava_shrees_school_portal" ]; then
            cp -r stitch_basava_shrees_school_portal www/
          fi
          echo "Web distribution folder prepared successfully."
          ls -la www/

      - name: Install Dependencies
        run: |
          npm install

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Make Gradlew Executable
        run: |
          cd android
          chmod +x ./gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Basava_Shree_School_Portal.apk
          echo "APK built successfully:"
          ls -lh output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Basava_Shree_School_Portal_APK
          path: output/Basava_Shree_School_Portal.apk
          retention-days: 90

      - name: Publish GitHub Release with Direct APK Download
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.6
          name: "Basava Shree School Portal Android App v1.0.6 (Daily Attendance & Interactive Calendar)"
          draft: false
          prerelease: false
          body: |
            ## 📱 Basava Shree School - Android App (APK v1.0.6)

            ### Direct Download:
            Click below to download the application directly to your Android phone or tablet:
            - **[Download Basava_Shree_School_Portal.apk](https://github.com/${{ github.repository }}/releases/download/v1.0.6/Basava_Shree_School_Portal.apk)**

            ---
            ### 📅 Daily Attendance Update & Start Today Engine (v1.0.6):
            - **Automatic "Today" Date Defaulting**: Live roll call automatically sets to the active day on launch and tab switch.
            - **Start Today's Roll Call Hero Card**: Prominent top card with live status badges (`Ready • In Progress` / `Submitted & Synced`), class indicators, and action triggers.
            - **Staff Matrix Fast-Action Banner**: One-click jump to daily roll call directly from the faculty directory matrix.
            - **Seamless Re-editing & Central ERP Sync**: Instant roll call marking, SQLite persistence (`/api/attendance/submit`), automated SMS alerts, and re-editing unlock.

            ---
            ### 🗓️ Dynamic Monthly Attendance Calendar & Session Inspector:
            - **Interactive Monthly Calendar Engine**: Full month navigation (`<` and `>`), active term indicator, and jump-to-month pills.
            - **Historical Evaluation Support**: Instant jump to October 2024 historical term with 31 days of verified logs.
            - **Live Student Sync & Color Indicators**: Emerald for Present, Rose for Absent, Amber ring for Today, and Purple for Institutional Holidays (e.g. Gandhi Jayanti).

            ---
            ### 🏫 Complete Multi-Grade Student Roster (All 12 Classes):
            - Enrolled students from Pre-Primary (LKG, UKG) through Secondary (Class 1 to 10).
            - Strict grade isolation: English Faculty (`BSS-101`) -> Class 10, Kannada Faculty (`BSS-102`) -> Class 9.
            - Real-time cross-device sync with SQLite persistence and Principal executive dashboard.
          files: output/Basava_Shree_School_Portal.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
